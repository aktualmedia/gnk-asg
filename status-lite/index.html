<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>GNK ASG Status Lite</title>
<style>body{margin:0;background:#07162d;color:#07162d;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:36px 16px}.head{color:#fff}.head h1{font-family:Georgia,serif;font-size:50px;font-weight:500}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border-radius:20px;padding:18px;border:1px solid #dbe4ef}.ok{border-top:4px solid #16a34a}.warn{border-top:4px solid #d97706}.bad{border-top:4px solid #dc2626}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:14px;padding:12px;overflow:auto;color:#23364e}.btn{display:inline-block;margin:6px 6px 6px 0;border-radius:999px;padding:10px 14px;background:#fffaf0;color:#7c5616;text-decoration:none;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap"><section class="head"><h1>Status Lite</h1><p>Odvojeni status/API pregled. Front i news ne ovise o ovom prikazu.</p><a class="btn" href="/front/">Front</a><a class="btn" href="/news/">News</a><a class="btn" href="/operator/app/">Admin</a></section><section class="grid" id="grid"></section><section class="card"><h2>Raw</h2><div id="raw" class="box">Učitavanje...</div></section></main><script>
(function(){const endpoints=[['update_status','/data/update_status.json'],['news','/data/news.json'],['market','/data/market.json'],['api_content','/api/operator/content/list?limit=1'],['api_mail','/api/operator/mail-log/list?limit=1']];const grid=document.getElementById('grid'),raw=document.getElementById('raw');async function test(name,url){const c=new AbortController();const t=setTimeout(()=>c.abort(),3500);try{const r=await fetch(url+(url.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store',credentials:'include',signal:c.signal});const text=await r.text();clearTimeout(t);return {name,url,http:r.status,ok:r.ok,sample:text.slice(0,300)}}catch(e){clearTimeout(t);return {name,url,http:0,ok:false,error:e.message}}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function run(){const out=[];for(const e of endpoints)out.push(await test(e[0],e[1]));grid.innerHTML=out.map(x=>'<article class="card '+(x.ok?'ok':(x.http===401?'warn':'bad'))+'"><h2>'+esc(x.name)+'</h2><p>'+esc(x.url)+'</p><strong>HTTP '+esc(x.http||'ERR')+'</strong></article>').join('');raw.textContent=JSON.stringify(out,null,2)}run();})();
</script></body></html>
