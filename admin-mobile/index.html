<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>GNK ASG Admin Mobile</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07162d;color:#fff}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;color:#07162d;border-radius:22px;padding:18px;margin:16px 0;border:1px solid rgba(212,175,55,.45)}h1{font-family:Georgia,serif;color:#d4af37}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #dce5f0;border-radius:14px;padding:12px;font:inherit}textarea{min-height:140px}button{border:0;border-radius:999px;background:#d4af37;color:#07162d;font-weight:900;padding:12px 16px;margin-top:14px}img{max-width:100%;border-radius:16px;margin-top:12px}.muted{color:#64748b;font-size:13px}.ok{background:#eaf9f0;color:#14532d;border-radius:14px;padding:10px;margin-top:12px}.warn{background:#fff7ed;color:#7c2d12;border-radius:14px;padding:10px;margin-top:12px}</style></head><body><main class="wrap"><h1>GNK ASG Admin Mobile</h1><p>Mobilni nacrt objave: fotografija, naslov, tekst i spremanje u lokalni nacrt ili budući media endpoint.</p><section class="card"><label>Admin token</label><input id="token" type="password" placeholder="Privremeni admin token"><label>Naslov objave</label><input id="title" placeholder="Naslov"><label>Kategorija</label><select id="category"><option>Objava</option><option>Galerija</option><option>Tržišta</option><option>Tehnologija</option><option>GNK ASG</option></select><label>Fotografija</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" alt="Pregled fotografije" style="display:none"><label>Tekst objave</label><textarea id="body" placeholder="Upiši tekst objave..."></textarea><button id="saveLocal" type="button">Spremi lokalni nacrt</button><button id="sendDraft" type="button">Pošalji u admin nacrte</button><div id="status" class="muted">Media endpoint još se povezuje. Lokalni nacrt radi odmah.</div></section><section class="card"><h2>Lokalni nacrti</h2><div id="drafts" class="muted">Nema nacrta.</div></section></main><script>const $=id=>document.getElementById(id);let photoData='';function readDrafts(){try{return JSON.parse(localStorage.getItem('gnk_admin_mobile_drafts')||'[]')}catch(e){return[]}}function writeDrafts(v){localStorage.setItem('gnk_admin_mobile_drafts',JSON.stringify(v))}function renderDrafts(){const d=readDrafts();$('drafts').innerHTML=d.length?d.map(x=>'<div class="warn"><b>'+x.title+'</b><br>'+x.category+' · '+x.created_at+'</div>').join(''):'Nema nacrta.'}$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;$('preview').src=photoData;$('preview').style.display='block'};r.readAsDataURL(f)};function payload(){return{title:$('title').value.trim(),category:$('category').value,body:$('body').value.trim(),photo:photoData,created_at:new Date().toISOString()}}$('saveLocal').onclick=()=>{const p=payload();if(!p.title||!p.body){$('status').className='warn';$('status').textContent='Unesi naslov i tekst.';return}const d=readDrafts();d.unshift(p);writeDrafts(d.slice(0,30));$('status').className='ok';$('status').textContent='Lokalni nacrt spremljen na uređaju.';renderDrafts()};$('sendDraft').onclick=async()=>{const p=payload();if(!p.title||!p.body){$('status').className='warn';$('status').textContent='Unesi naslov i tekst.';return}try{const r=await fetch('/api/media/draft',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify(p)});const j=await r.json();$('status').className=j.ok?'ok':'warn';$('status').textContent=j.ok?'Nacrt poslan u media operator.':'Endpoint nije aktivan ili token nije ispravan.'}catch(e){$('status').className='warn';$('status').textContent='Media endpoint još nije aktivan. Koristi lokalni nacrt.'}};renderDrafts();</script></body></html>
