<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNK ASG News Lite</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#07162d}.top{height:72px;background:#fff;border-bottom:1px solid #dde6ef;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}.top a{font-weight:900;color:#143b6d;text-decoration:none;margin-left:14px}.hero{padding:48px 24px;background:linear-gradient(135deg,#fff,#edf3f8)}.wrap{max-width:1100px;margin:auto}.hero h1{font-family:Georgia,serif;font-size:56px;font-weight:500;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:28px 24px}.card{background:#fff;border:1px solid #dde6ef;border-radius:20px;padding:20px}.card small{font-weight:900;color:#8a5d13;text-transform:uppercase}.card h2{font-size:20px;margin:10px 0;color:#07162d}.card p{color:#64748b}.btn{display:inline-block;background:#07162d;color:#fff;text-decoration:none;padding:11px 15px;border-radius:999px;font-weight:900;margin:6px 8px 6px 0}.status{background:#fff;border:1px solid #dde6ef;border-radius:16px;padding:14px;margin-top:14px;color:#23364e}footer{background:#07162d;color:#fff;padding:28px 24px;margin-top:20px}@media(max-width:800px){.hero h1{font-size:40px}.grid{grid-template-columns:1fr}.top{display:block;height:auto;padding:16px}.top nav{margin-top:10px}}</style></head><body><header class="top"><strong>GNK ASG News</strong><nav><a href="/f/">Front</a><a href="/n/">Vijesti</a><a href="/operator/app/">Admin</a></nav></header><main><section class="hero"><div class="wrap"><h1>News Lite</h1><p>Vijesti su sada odvojene od fronta. Stranica se otvara odmah s lokalnim fallbackom, a live feed se učitava samo ako je dostupan.</p><a class="btn" href="/operator/api-check/">API Check</a><a class="btn" href="/status-lite/">Status Lite</a><div id="status" class="status">Prikazan je lokalni fallback. Provjeravam live feed...</div></div></section><section class="wrap grid" id="grid"></section></main><footer><div class="wrap">© 2026 GNK ASG d.o.o. · News Lite</div></footer><script>const fallback=[{s:'GNK ASG',t:'Portal je razdvojen na brzi front i news sloj',p:'Front više ne mora čekati vijesti, market ili backend. News se otvara posebno.'},{s:'GNK ASG',t:'Admin App ostaje odvojena',p:'Mail, objave, smart replies i API provjere dostupni su kroz operator aplikaciju.'},{s:'GNK ASG',t:'Status Lite prati dostupnost podataka',p:'Ako live feed padne, status sloj pokazuje gdje je problem bez rušenja fronta.'}];const g=document.getElementById('grid'),st=document.getElementById('status');function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(a,msg){st.textContent=msg;g.innerHTML=a.map(x=>'<article class="card"><small>'+esc(x.s||x.source||'NEWS')+'</small><h2>'+esc(x.t||x.title||'Bez naslova')+'</h2><p>'+esc(x.p||x.summary||x.description||'')+'</p></article>').join('')}async function live(){render(fallback,'Lokalni fallback je prikazan. Provjeravam live feed...');const c=new AbortController();const timer=setTimeout(()=>c.abort(),2500);try{const r=await fetch('/data/news.json?cb='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const items=Array.isArray(d)?d:(d.items||d.news||[]);if(!items.length)throw new Error('prazan feed');render(items.slice(0,30).map(x=>({s:x.source||x.category,t:x.title,p:x.summary||x.description})),'Live feed OK: '+items.length+' stavki.')}catch(e){clearTimeout(timer);render(fallback,'Live feed nije dostupan: '+e.message+'. Fallback ostaje prikazan.')}}render(fallback,'Lokalni fallback prikazan.');setTimeout(live,200);</script></body></html>
