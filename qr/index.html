<html lang="hr">
<head>

  <meta name="description" content="QR i ručni link za GNK ASG mobilni portal.">
  <link rel="stylesheet" href="../assets/style.css?v=20260523-8">
  <style>body{background:#07162d;margin:0;color:#07162d}.wrap{max-width:760px;margin:auto;padding:42px 18px}.panel{background:#fff;border-radius:24px;padding:28px;border:1px solid #dce5f0;text-align:center}h1{font-family:Georgia,serif;color:#07162d;font-size:42px}.qr{margin:22px auto;width:220px;height:220px;border:12px solid #07162d;border-radius:18px;display:grid;place-items:center;background:#f7f9fc;color:#143b6d;font-weight:900}.btn{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:999px;background:#143b6d;color:#fff;text-decoration:none;font-weight:900}</style>

<body>
  <main class="wrap"><section class="panel"><h1>GNK ASG App</h1><p>Ručni instalacijski link za mobilni portal.</p><div class="qr" aria-label="QR placeholder">QR<br>APP</div><p>Stvarni QR kod može se dodati u sljedećem koraku kao slika ili generirani SVG. Cilj poveznice je:</p><p><strong>https://gnk-asg.hr/app/</strong></p><a class="btn" href="../app/">Otvori aplikaciju</a></section></main>
