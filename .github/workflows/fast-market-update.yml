name: Manual Market Refresh Fallback

# Rezervni ručni postupak. Automatski raspored vodi .github/workflows/portal-live-refresh.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-market-refresh-fallback
  cancel-in-progress: false

jobs:
  refresh-market:
    name: Manually refresh public market panels
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update fast-moving digital asset datasets
        run: python scripts/update_fast_market.py
      - name: Publish market datasets
        run: |
          set -e
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json
          if git diff --cached --quiet; then
            echo "No market changes."
            exit 0
          fi
          git commit -m "Manual market refresh fallback update"
          git push origin HEAD:main
