name: Five Minute Market Intelligence Update

# Resilient refresh: successful modules and status are published even if one public source is temporarily unavailable.
# The schedule is offset from the top of the hour to reduce GitHub Actions queue congestion.
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_fast_market.py'
      - '.github/workflows/fast-market-update.yml'

permissions:
  contents: write

concurrency:
  group: fast-market-intelligence-update
  cancel-in-progress: false

jobs:
  refresh-market:
    name: Refresh digital assets stablecoins exchanges and indices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update fast moving market datasets
        id: market_fetch
        continue-on-error: true
        run: python scripts/update_fast_market.py
      - name: Publish latest generated market datasets without merge conflicts
        run: |
          set -e
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/gnk-fast-market-data
          cp data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json /tmp/gnk-fast-market-data/
          publish_generated_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-fast-market-data/*.json data/
            git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json
            if git diff --cached --quiet; then
              echo "No market changes."
              return 0
            fi
            git commit -m "Automated five minute market intelligence update"
            git push origin HEAD:main
          }
          publish_generated_data || (sleep 8 && publish_generated_data)
      - name: Disclose partial refresh without blocking publication
        if: steps.market_fetch.outcome == 'failure'
        run: echo "At least one public market source was temporarily unavailable; status and successfully generated datasets were published."
