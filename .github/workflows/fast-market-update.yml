name: Automated Market Data Refresh

# Odvojeni automatski ciklus tržišnih podataka.
# Ne obrađuje vijesti i ne mijenja njihov status; javni deployment preuzima najnovije podatke u redovnom ciklusu portala.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fast-market-update.yml'
      - 'scripts/update_fast_market.py'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: automated-fast-market-refresh-v1
  cancel-in-progress: false

jobs:
  refresh-market:
    name: Refresh public market datasets only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate market processor
        run: python -m py_compile scripts/update_fast_market.py
      - name: Refresh fast-moving market datasets
        run: python scripts/update_fast_market.py
      - name: Validate market status output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/fast_market_status.json').read_text(encoding='utf-8'))
          assert not status.get('errors'), status
          assert status.get('digital_assets', {}).get('coins', 0) >= 8, status
          assert status.get('cadence') == 'scheduled every five minutes', status
          print('Tržišni podaci spremni:', status.get('updated_at'))
          PY
      - name: Commit market data without touching news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-market-output && mkdir -p /tmp/gnk-market-output
          cp data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json /tmp/gnk-market-output/
          publish_market() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-market-output/*.json data/
            git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json
            if git diff --cached --quiet; then
              echo "Nema novih tržišnih promjena."
              return 0
            fi
            git commit -m "Automated isolated market data refresh"
            git push origin HEAD:main
          }
          publish_market || (sleep 5 && publish_market) || (sleep 10 && publish_market)
