name: Five Minute Market Intelligence Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_fast_market.py'
      - '.github/workflows/fast-market-update.yml'

permissions:
  contents: write

concurrency:
  group: fast-market-intelligence-update
  cancel-in-progress: true

jobs:
  refresh-market:
    name: Refresh digital assets, stablecoins, exchanges and indices
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update fast-moving market datasets
        run: python scripts/update_fast_market.py
      - name: Commit refreshed market datasets
        run: |
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No market changes."
          else
            git commit -m "Automated five minute market intelligence update"
            git push
          fi
