name: Autonomous Public Live Refresh

# Glavni automatski ciklus javnog portala.
# Javni prozor sadrži do 500 najnovijih vijesti, a aktivna arhiva do 400 starijih stavki.
# Nova vijest mora se objaviti i ako pomoćni tržišni ili arhivski korak privremeno zakaže.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/autonomous-public-live-refresh.yml'
      - 'scripts/update_feeds_resilient.py'
      - 'scripts/trim_news_archive.py'
      - 'scripts/update_fast_market.py'
      - 'scripts/update_macro_data.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autonomous-public-live-refresh-v2
  cancel-in-progress: true

jobs:
  refresh-commit-and-deploy:
    name: Refresh and publish public portal
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate news processors
        run: python -m py_compile scripts/update_feeds_resilient.py scripts/trim_news_archive.py
      - name: Refresh newest public news items
        run: python scripts/update_feeds_resilient.py
      - name: Bound active archive to newest 400 displaced items without blocking new publication
        run: python scripts/trim_news_archive.py || echo "Archive maintenance unavailable in this cycle; final publication guard will normalize the active archive."
      - name: Enforce public and archive windows before publication
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          public_path = Path('data/news.json')
          archive_path = Path('data/news_archive.json')
          status_path = Path('data/update_status.json')
          try:
              public = json.loads(public_path.read_text(encoding='utf-8'))
          except Exception:
              public = []
          try:
              archive = json.loads(archive_path.read_text(encoding='utf-8'))
          except Exception:
              archive = []
          public = [item for item in public if isinstance(item, dict)] if isinstance(public, list) else []
          archive = [item for item in archive if isinstance(item, dict)] if isinstance(archive, list) else []
          public.sort(key=lambda item: str(item.get('published_at', '')), reverse=True)
          archive.sort(key=lambda item: str(item.get('published_at', '')), reverse=True)
          public = public[:500]
          archive = archive[:400]
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          archive_path.write_text(json.dumps(archive, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          try:
              payload = json.loads(status_path.read_text(encoding='utf-8'))
          except Exception:
              payload = {}
          news = payload.setdefault('news', {})
          news['public_items'] = len(public)
          news['max_public_items'] = 500
          news['archive_items'] = len(archive)
          news['max_archive_items'] = 400
          news['storage_policy'] = 'public_latest_500_archive_latest_400_older_overflow_removed'
          news['publication_guard_at'] = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat()
          status_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Ready for publication: public={len(public)}, archive={len(archive)}')
          PY
      - name: Refresh core public market data without blocking refreshed news
        run: python scripts/update_fast_market.py || echo "Core market source temporarily unavailable; refreshed news continue to publication."
      - name: Refresh optional comparison chart without blocking publication
        run: python scripts/update_macro_data.py || echo "Optional comparison chart temporarily unavailable; refreshed news continue to publication."
      - name: Commit refreshed data safely
        shell: bash
        run: |
          set -e
          git config user.name "gnk-asg-autonomous-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-autonomous-output && mkdir -p /tmp/gnk-autonomous-output
          cp data/news.json data/news_archive.json data/update_status.json /tmp/gnk-autonomous-output/
          cp data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json /tmp/gnk-autonomous-output/ 2>/dev/null || true
          cp data/macro_market.json /tmp/gnk-autonomous-output/ 2>/dev/null || true
          publish_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-autonomous-output/*.json data/
            git add data/news.json data/news_archive.json data/update_status.json
            git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json data/macro_market.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No data differences to commit; continuing to public deployment."
              return 0
            fi
            git commit -m "Automated autonomous public live refresh"
            git push origin HEAD:main
          }
          publish_data || (sleep 5 && publish_data) || (sleep 10 && publish_data)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare refreshed public build for deployment
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude '*.py' \
            ./ _site/
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/data/news.json
          test -f _site/data/news_archive.json
          test -f _site/data/update_status.json
      - name: Upload public portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed public portal
        id: deployment
        uses: actions/deploy-pages@v4
