name: Stable News Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-news-supervisor.yml'
      - 'scripts/news_publication.py'
      - 'scripts/news_heartbeat.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
  schedule:
    - cron: '0 0 * * *'
    - cron: '21 1 * * *'
    - cron: '42 2 * * *'
    - cron: '3 4 * * *'
    - cron: '24 5 * * *'
    - cron: '45 6 * * *'
    - cron: '6 8 * * *'
    - cron: '27 9 * * *'
    - cron: '48 10 * * *'
    - cron: '9 12 * * *'
    - cron: '30 13 * * *'
    - cron: '51 14 * * *'
    - cron: '12 16 * * *'
    - cron: '33 17 * * *'
    - cron: '54 18 * * *'
    - cron: '15 20 * * *'
    - cron: '36 21 * * *'
    - cron: '57 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stable-news-supervisor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check --quiet Pillow
      - name: Run news modules without hard stop
        shell: bash
        run: |
          python -m py_compile scripts/news_publication.py scripts/news_heartbeat.py
          python scripts/news_publication.py || echo "news publication partial"
          python scripts/news_heartbeat.py
      - name: Commit news data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-asg-news-supervisor"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/update_status.json assets/news-preview podijeli/vijest
          if git diff --cached --quiet; then
            echo "No news data changes."
          else
            git commit -m "Stable news supervisor refresh"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
