name: Hourly News and Macro Reference Update

# Resilient hourly publication: news and macro data are committed even when other automated updates reach main concurrently.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_feeds_v2.py'
      - 'scripts/update_macro_data.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
      - '.github/workflows/hourly-data-update.yml'

permissions:
  contents: write

concurrency:
  group: hourly-public-news-macro-update
  cancel-in-progress: false

jobs:
  update-hourly:
    name: Refresh classified news and macro reference series
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update hourly classified news
        run: python scripts/update_feeds_v2.py
      - name: Update macro comparison reference
        run: python scripts/update_macro_data.py
      - name: Commit refreshed hourly public datasets
        run: |
          git config user.name "gnk-asg-hourly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/macro_market.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No hourly data changes."
          else
            git commit -m "Automated hourly news and macro reference update"
            git pull --rebase origin main
            git push origin HEAD:main || (sleep 8 && git pull --rebase origin main && git push origin HEAD:main)
          fi
