name: Manual News Refresh Fallback

# Rezervni ručni postupak. Automatski raspored vodi .github/workflows/portal-live-refresh.yml.
# Javni prikaz zadržava najnovijih 500 vijesti, a višak ostaje spremljen u data/news_archive.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-news-refresh-fallback
  cancel-in-progress: false

jobs:
  update-news:
    name: Manually refresh public news and archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public news processor
        run: python -m py_compile scripts/update_feeds_v2.py
      - name: Update public news and archived overflow
        run: python scripts/update_feeds_v2.py
      - name: Publish public list and archive
        run: |
          set -e
          git config user.name "gnk-asg-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No public news or archive changes."
            exit 0
          fi
          git commit -m "Manual public news and archive refresh"
          git push origin HEAD:main
