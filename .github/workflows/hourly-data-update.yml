name: Hourly News Update

# Jedini aktivni proces za javne vijesti. Tržišni i makro podatci osvježavaju se odvojeno kroz petominutni market workflow.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_feeds_v2.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
      - '.github/workflows/hourly-data-update.yml'

permissions:
  contents: write

concurrency:
  group: public-portal-data-publication
  cancel-in-progress: false

jobs:
  update-hourly:
    name: Refresh classified public news series
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update hourly classified news
        run: python scripts/update_feeds_v2.py
      - name: Publish latest generated news dataset without merge conflicts
        run: |
          set -e
          git config user.name "gnk-asg-hourly-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/gnk-news-data
          cp data/news.json data/update_status.json /tmp/gnk-news-data/
          publish_generated_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-news-data/*.json data/
            git add data/news.json data/update_status.json
            if git diff --cached --quiet; then
              echo "No hourly news changes."
              return 0
            fi
            git commit -m "Automated hourly public news update"
            git push origin HEAD:main
          }
          publish_generated_data || (sleep 8 && publish_generated_data)
