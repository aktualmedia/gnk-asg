name: Hourly Business and Market Update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_feeds_v2.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
      - '.github/workflows/hourly-data-update.yml'

permissions:
  contents: write

concurrency:
  group: hourly-public-data-update
  cancel-in-progress: false

jobs:
  update-data:
    name: Refresh classified news and digital assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update fresh news, prices and Bitcoin history
        run: python scripts/update_feeds_v2.py
      - name: Commit refreshed public datasets
        run: |
          git config user.name "gnk-asg-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/market.json data/btc_chart.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Automated hourly classified data update"
            git push
          fi
