name: Hourly News Update

# Satni javni sloj ažurira vijesti, njihove društvene preview stranice i referentne tržišne podatke.
# Brzi market primarno radi kroz petominutni workflow; ovdje se izvršava samo kao sigurnosni satni fallback.
on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_feeds_v2.py'
      - 'scripts/generate_news_share_previews.py'
      - 'scripts/update_fast_market.py'
      - 'scripts/update_macro_data.py'
      - 'scripts/update_market_extensions.py'
      - 'scripts/update_open_data.py'
      - 'data/news_config_v2.json'
      - 'data/blocked_news.json'
      - '.github/workflows/hourly-data-update.yml'

permissions:
  contents: write

concurrency:
  group: hourly-public-news
  cancel-in-progress: true

jobs:
  update-hourly:
    name: Refresh hourly public datasets social previews and market fallback
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install news preview image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate hourly Python processors
        run: python -m py_compile scripts/update_feeds_v2.py scripts/generate_news_share_previews.py scripts/update_macro_data.py scripts/update_market_extensions.py scripts/update_open_data.py scripts/update_fast_market.py
      - name: Update hourly classified news and per-item social previews
        run: |
          python scripts/update_feeds_v2.py
          python scripts/generate_news_share_previews.py
      - name: Update public reference datasets
        run: |
          python scripts/update_macro_data.py
          python scripts/update_market_extensions.py
          python scripts/update_open_data.py
      - name: Refresh fast market datasets as hourly fallback
        run: python scripts/update_fast_market.py
      - name: Publish latest generated datasets and news previews without merge conflicts
        run: |
          set -e
          git config user.name "gnk-asg-hourly-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-hourly-output
          mkdir -p /tmp/gnk-hourly-output/data /tmp/gnk-hourly-output/assets /tmp/gnk-hourly-output/podijeli
          cp data/news.json data/update_status.json data/macro_market.json data/asg_gold_asset.json data/stock_exchanges.json data/open_data.json data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json /tmp/gnk-hourly-output/data/
          cp -R assets/news-preview /tmp/gnk-hourly-output/assets/ 2>/dev/null || true
          cp -R podijeli/vijest /tmp/gnk-hourly-output/podijeli/ 2>/dev/null || true
          publish_generated_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-hourly-output/data/*.json data/
            mkdir -p assets podijeli
            cp -R /tmp/gnk-hourly-output/assets/news-preview assets/ 2>/dev/null || true
            cp -R /tmp/gnk-hourly-output/podijeli/vijest podijeli/ 2>/dev/null || true
            git add data/news.json data/update_status.json data/macro_market.json data/asg_gold_asset.json data/stock_exchanges.json data/open_data.json data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json assets/news-preview/ podijeli/vijest/
            if git diff --cached --quiet; then
              echo "No hourly changes."
              return 0
            fi
            git commit -m "Automated hourly public data and individual news preview update"
            git push origin HEAD:main
          }
          publish_generated_data || (sleep 8 && publish_generated_data)
