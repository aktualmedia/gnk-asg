name: Refresh stock exchange monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_stock_exchanges.py'
      - '.github/workflows/refresh-stock-exchanges.yml'
      - '.github/triggers/refresh-stock-exchanges-now.txt'

permissions:
  contents: write

concurrency:
  group: refresh-stock-exchanges
  cancel-in-progress: true

jobs:
  refresh-stock-exchanges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh stock exchange monitor
        run: python scripts/refresh_stock_exchanges.py
      - name: Commit refreshed stock exchange data
        run: |
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stock_exchanges.json
          if git diff --cached --quiet; then
            echo "No stock exchange data changes to commit."
          else
            git commit -m "Refresh stock exchange monitor data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
