name: Portal Live Data Refresh

# Samostalan tržišni proces portala.
# Vijesti i arhivu vodi isključivo .github/workflows/news-feed-archive-refresh.yml.
# Ova izolacija sprječava da kvar tržišta, grafikona ili objave blokira vijesti.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portal-live-refresh.yml'
      - 'scripts/update_fast_market.py'
      - 'scripts/update_macro_data.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: portal-market-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh-public-market-data:
    name: Refresh and publish public market data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate market processors
        run: python -m py_compile scripts/update_fast_market.py scripts/update_macro_data.py
      - name: Refresh fast market datasets every cycle
        run: python scripts/update_fast_market.py
      - name: Refresh cross-asset Bitcoin comparison graph every cycle
        run: python scripts/update_macro_data.py
      - name: Publish generated market data without touching news archive
        shell: bash
        run: |
          set -e
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-market-output
          mkdir -p /tmp/gnk-market-output
          cp data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json data/macro_market.json /tmp/gnk-market-output/
          publish_market() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-market-output/*.json data/
            git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json data/macro_market.json
            if git diff --cached --quiet; then
              echo "No new market changes to publish."
              return 0
            fi
            git commit -m "Automated portal market data refresh"
            git push origin HEAD:main
          }
          publish_market || (sleep 8 && publish_market) || (sleep 15 && publish_market)
