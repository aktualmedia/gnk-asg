name: Manual Market Data Refresh

# Ručna rezerva za tržišne podatke.
# Jedini redovni automatski ciklus je autonomous-public-live-refresh.yml,
# koji osvježava vijesti, održava javnih 500 i arhivskih 400 stavki te objavljuje portal.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-market-data-refresh
  cancel-in-progress: true

jobs:
  refresh-public-market-data:
    name: Manually refresh market data only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate market processor
        run: python -m py_compile scripts/update_fast_market.py
      - name: Refresh core market datasets
        run: python scripts/update_fast_market.py
      - name: Refresh optional comparison chart without blocking core market output
        run: python scripts/update_macro_data.py || echo "Optional comparison chart unavailable; publishing core market data."
      - name: Publish market files only
        run: |
          set -e
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json
          git add data/macro_market.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No market changes to publish."
            exit 0
          fi
          git commit -m "Manual portal market refresh"
          git pull --rebase origin main
          git push origin HEAD:main
