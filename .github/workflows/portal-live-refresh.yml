name: Portal Live Data Refresh

# Primarni i samostalni proces za aktualne tržišne podatke portala.
# Vijesti i arhivu vodi zasebni resilient news proces.
# Tržišni prikaz mora se objaviti i kada opcionalni usporedni graf privremeno zakaže.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portal-live-refresh.yml'
      - 'scripts/update_fast_market.py'
      - 'scripts/update_macro_data.py'
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'

permissions:
  contents: write

concurrency:
  group: portal-market-live-data-refresh-v4
  cancel-in-progress: true

jobs:
  refresh-public-market-data:
    name: Refresh and publish market data independently
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required market processor
        run: python -m py_compile scripts/update_fast_market.py
      - name: Refresh required fast market datasets
        run: python scripts/update_fast_market.py
      - name: Refresh optional cross-asset chart without blocking core publication
        run: python scripts/update_macro_data.py || echo "Optional cross-asset chart unavailable; publishing current core market status."
      - name: Validate core market status before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/fast_market_status.json').read_text(encoding='utf-8'))
          assert status.get('status') == 'ok', status
          assert isinstance(status.get('errors'), list) and not status.get('errors'), status
          print('Core market refresh validated:', status.get('updated_at'))
          PY
      - name: Publish generated market data without touching news files
        shell: bash
        run: |
          set -e
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-market-output
          mkdir -p /tmp/gnk-market-output
          cp data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json /tmp/gnk-market-output/
          cp data/macro_market.json /tmp/gnk-market-output/ 2>/dev/null || true
          publish_market() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-market-output/market.json /tmp/gnk-market-output/stablecoins.json /tmp/gnk-market-output/exchange_compare.json /tmp/gnk-market-output/market_indices.json /tmp/gnk-market-output/btc_chart.json /tmp/gnk-market-output/fast_market_status.json data/
            cp /tmp/gnk-market-output/macro_market.json data/ 2>/dev/null || true
            git add data/market.json data/stablecoins.json data/exchange_compare.json data/market_indices.json data/btc_chart.json data/fast_market_status.json
            git add data/macro_market.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No new market changes to publish."
              return 0
            fi
            git commit -m "Automated independent portal market refresh"
            git push origin HEAD:main
          }
          publish_market || (sleep 5 && publish_market) || (sleep 10 && publish_market)
