name: Review Queue Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/media_queries.json'
      - 'scripts/discover_corporate_media.py'
      - '.github/workflows/review-queue-refresh.yml'

permissions:
  contents: write

concurrency:
  group: review-queue-refresh
  cancel-in-progress: true

jobs:
  refresh-review-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public-source review queue
        run: python scripts/discover_corporate_media.py
      - name: Save refreshed review queue
        run: |
          if git diff --quiet -- data/corporate_review_queue.json data/update_status.json; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corporate_review_queue.json data/update_status.json
          git commit -m "Refresh public-source review queue [skip ci]"
          git push
