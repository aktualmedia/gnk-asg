name: Corporate Media Automatic Publication

# Samostalan proces automatski objavljuje javne medijske nalaze o konfiguriranim subjektima.
# Ovlašteno uklonjene poveznice ostaju isključene putem data/media_removed.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '39 * * * *'
  push:
    branches:
      - main
    paths:
      - 'data/media_queries.json'
      - 'data/media_removed.json'
      - 'scripts/discover_corporate_media.py'
      - '.github/workflows/media-monitor-status.yml'

permissions:
  contents: write

concurrency:
  group: hourly-media-monitor-publication
  cancel-in-progress: true

jobs:
  publish-media:
    name: Discover and publish corporate media items
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public corporate media results
        run: python scripts/discover_corporate_media.py
      - name: Publish media items and dedicated monitor status
        run: |
          set -e
          git config user.name "gnk-asg-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/gnk-media-output
          mkdir -p /tmp/gnk-media-output
          cp data/media_approved.json data/media_monitor_status.json /tmp/gnk-media-output/
          publish_generated_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/gnk-media-output/media_approved.json data/media_approved.json
            cp /tmp/gnk-media-output/media_monitor_status.json data/media_monitor_status.json
            git add data/media_approved.json data/media_monitor_status.json
            if git diff --cached --quiet; then
              echo "No corporate media changes."
              return 0
            fi
            git commit -m "Automated corporate media publication update"
            git push origin HEAD:main
          }
          publish_generated_data || (sleep 8 && publish_generated_data)
