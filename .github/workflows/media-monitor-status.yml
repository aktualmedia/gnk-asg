name: Media Monitor Status

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches:
      - main
    paths:
      - 'data/media_queries.json'
      - 'scripts/discover_corporate_media.py'
      - '.github/workflows/media-monitor-status.yml'

permissions:
  contents: write

concurrency:
  group: media-monitor-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh monitor status
        run: python scripts/discover_corporate_media.py
      - name: Commit status files
        run: |
          if git diff --quiet -- data/media_monitor_status.json data/update_status.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media_monitor_status.json data/update_status.json
          git commit -m "Refresh media monitor status [skip ci]"
          git push
