name: Manual Corporate Media Refresh Fallback

# Rezervni ručni postupak. Automatski raspored vodi .github/workflows/portal-live-refresh.yml.
# Ovlašteno uklonjene poveznice ostaju isključene putem data/media_removed.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-media-refresh-fallback
  cancel-in-progress: false

jobs:
  publish-media:
    name: Manually discover and publish corporate media items
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public corporate media results
        run: python scripts/discover_corporate_media.py
      - name: Publish media items and dedicated monitor status
        run: |
          set -e
          git config user.name "gnk-asg-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/media_approved.json data/media_monitor_status.json
          if git diff --cached --quiet; then
            echo "No corporate media changes."
            exit 0
          fi
          git commit -m "Manual corporate media publication update"
          git push origin HEAD:main
