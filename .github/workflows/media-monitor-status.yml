name: Media Monitor Status

# Ovaj proces vodi samo status medijskog praćenja i ne smije prepisivati datum javnih vijesti.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches:
      - main
    paths:
      - 'data/media_queries.json'
      - 'scripts/discover_corporate_media.py'
      - '.github/workflows/media-monitor-status.yml'

permissions:
  contents: write

concurrency:
  group: public-portal-data-publication
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh monitor status
        run: python scripts/discover_corporate_media.py
      - name: Publish media monitor status without modifying news timestamp
        run: |
          set -e
          git config user.name "gnk-asg-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/media_monitor_status.json /tmp/media_monitor_status.json
          publish_generated_data() {
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/media_monitor_status.json data/media_monitor_status.json
            git add data/media_monitor_status.json
            if git diff --cached --quiet; then
              echo "No media monitor status changes."
              return 0
            fi
            git commit -m "Automated media monitor status update"
            git push origin HEAD:main
          }
          publish_generated_data || (sleep 8 && publish_generated_data)
