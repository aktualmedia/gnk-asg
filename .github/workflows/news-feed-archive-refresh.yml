name: Manual News Feed and Archive Refresh

# Ručna rezerva za dijagnostiku ili izvanredno osvježavanje.
# Redovito automatsko osvježavanje vodi isključivo autonomous-public-live-refresh.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed-archive-refresh-v4
  cancel-in-progress: true

jobs:
  refresh-news-and-archive:
    name: Manually publish latest 500 news items and preserve overflow archive
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resilient news processor
        run: python -m py_compile scripts/update_feeds_resilient.py
      - name: Refresh public list and archived overflow
        run: python scripts/update_feeds_resilient.py
      - name: Validate public limit, engine and persistent archive output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          public = json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          archive = json.loads(Path('data/news_archive.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/update_status.json').read_text(encoding='utf-8')).get('news', {})
          assert isinstance(public, list) and len(public) <= 500
          assert isinstance(archive, list)
          assert status.get('engine') == 'resilient_parallel_v4'
          assert status.get('public_items') == len(public)
          assert status.get('archive_items') == len(archive)
          print(f'Validated public={len(public)} archive={len(archive)}')
          PY
      - name: Publish refreshed news and archive
        run: |
          set -e
          git config user.name "gnk-asg-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No generated news changes to publish."
            exit 0
          fi
          git commit -m "Manual resilient news feed and archive refresh"
          git pull --rebase origin main
          git push origin HEAD:main
