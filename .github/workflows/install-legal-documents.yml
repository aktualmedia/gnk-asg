          def render(filename, info):
              title = info['title']
              desc = info['description']
              canonical = f"https://gnk-asg.hr/legal/" if filename == 'index.html' else f"https://gnk-asg.hr/legal/{filename}"
              return f'''<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{html.escape(title)}</title>
  <meta name="description" content="{html.escape(desc)}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="{canonical}">
  <link rel="stylesheet" href="../assets/style.css?v=20260523-8">
  <link rel="icon" href="https://gnk-asg.hr/favicon.svg" type="image/svg+xml" sizes="any">
  <meta property="og:title" content="{html.escape(title)}">
  <meta property="og:description" content="{html.escape(desc)}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{canonical}">
  <meta property="og:site_name" content="GNK ASG d.o.o.">
  <meta property="og:locale" content="hr_HR">
  <meta property="og:image" content="https://gnk-asg.hr/assets/gnk-asg-social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  {legal_css}
</head>
<body>
{nav}
<main id="top">
<section class="legal-hero"><div class="container"><p class="eyebrow">Legal · GNK ASG d.o.o.</p><h1>{html.escape(title.replace(' | GNK ASG d.o.o.', ''))}</h1><p>{html.escape(desc)} Zadnje ažuriranje: {today}</p></div></section>
<section><div class="container legal-layout"><aside class="legal-sidebar"><a href="./">Pregled legal dokumenata</a><a href="impressum.html">Impresum</a><a href="privacy.html">Politika privatnosti</a><a href="cookies.html">Politika kolačića</a><a href="terms.html">Uvjeti korištenja</a><a href="disclaimer.html">Pravna napomena</a><a href="data-status.html">Status podataka</a><a href="ai-disclaimer.html">AI napomena</a><a href="accessibility.html">Pristupačnost</a></aside><article class="legal-doc">{info['body']}</article></div></section>
</main>
{footer}
<a class="float-home" href="#top" aria-label="Na vrh">⌂</a>
<script>document.getElementById('menuToggle')?.addEventListener('click',()=>document.getElementById('navLinks')?.classList.toggle('open'));</script>
</body>
</html>
'''

          for filename, info in pages.items():
              (legal_dir / filename).write_text(render(filename, info), encoding='utf-8')

          # Patch homepage navigation and footer without touching visual identity.
          index = Path('index.html')
          if index.exists():
              txt = index.read_text(encoding='utf-8')
              txt = txt.replace('<a href="#dokumenti">Dokumenti</a><a href="nermin-sefic/">Nermin Sefić</a>', '<a href="#dokumenti">Dokumenti</a><a href="legal/">Legal</a><a href="nermin-sefic/">Nermin Sefić</a>')
              txt = txt.replace('<a href="#news">Business News</a></div></div><div class="copyright">', '<a href="#news">Business News</a><a href="legal/">Legal</a></div></div><div class="copyright">')
              # Add a Legal document tile to the documents section if not already present.
              marker = '<article class="doc"><span class="tag">Legal · GNK ASG d.o.o.</span><h3>Pravni i statusni dokumenti portala</h3><p>Impresum, politika privatnosti, kolačići, uvjeti korištenja, pravna napomena, status podataka, AI napomena i pristupačnost.</p><a href="legal/">OTVORI LEGAL →</a></article>'
              if 'Pravni i statusni dokumenti portala' not in txt:
                  txt = txt.replace('</a></article></div></div></section>\n</main>', '</a></article>' + marker + '</div></div></section>\n</main>')
              index.write_text(txt, encoding='utf-8')

          # Patch sitemap with Legal URLs.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              sm = sitemap.read_text(encoding='utf-8')
              legal_urls = ['legal/', 'legal/impressum.html', 'legal/privacy.html', 'legal/cookies.html', 'legal/terms.html', 'legal/disclaimer.html', 'legal/data-status.html', 'legal/ai-disclaimer.html', 'legal/accessibility.html']
              block = ''
              for u in legal_urls:
                  loc = f'https://gnk-asg.hr/{u}'
                  if loc not in sm:
                      block += f'''  <url>\n    <loc>{loc}</loc>\n    <lastmod>{iso_today}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n'''
              if block:
                  sm = sm.replace('</urlset>', block + '</urlset>')
                  sitemap.write_text(sm, encoding='utf-8')

          # Keep a machine-readable manifest for later AI/status modules.
          manifest = legal_dir / 'manifest.json'
          manifest.write_text('''{
  "updated": "2026-06-12",
  "publisher": "GNK ASG d.o.o.",
  "pages": [
    {"title":"Legal dokumenti", "url":"/legal/"},
    {"title":"Impresum", "url":"/legal/impressum.html"},
    {"title":"Politika privatnosti", "url":"/legal/privacy.html"},
    {"title":"Politika kolačića", "url":"/legal/cookies.html"},
    {"title":"Uvjeti korištenja", "url":"/legal/terms.html"},
    {"title":"Pravna napomena", "url":"/legal/disclaimer.html"},
    {"title":"Status podataka i izvora", "url":"/legal/data-status.html"},
    {"title":"AI napomena", "url":"/legal/ai-disclaimer.html"},
    {"title":"Izjava o pristupačnosti", "url":"/legal/accessibility.html"}
  ]
}
''', encoding='utf-8')

      - name: Commit legal documents
        shell: bash
        run: |
          git config user.name "gnk-asg-legal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml legal/
          if git diff --cached --quiet; then
            echo "No legal changes to commit."
          else
            git commit -m "Add legal and data status documents"
            git push
          fi
