<p>Javni AI asistent namijenjen je posjetiteljima i smije koristiti samo javne informacije. Administrativni Portal Operator, ako je aktiviran, mora biti odvojen, zaštićen i ograničen na ovlaštene korisnike i posebne sigurnosne kanale.</p>
