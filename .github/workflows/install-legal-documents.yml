          }

          pages['accessibility.html'] = {
              'title': 'Izjava o pristupačnosti | GNK ASG d.o.o.',
              'description': 'Izjava o pristupačnosti i dostupnosti sadržaja portala GNK ASG d.o.o.',
              'body': '''<h2>Izjava o pristupačnosti</h2>
<p>GNK ASG d.o.o. nastoji portal učiniti dostupnim što širem krugu korisnika, uključujući korisnike pomoćnih tehnologija i korisnike s različitim potrebama pristupa.</p>
