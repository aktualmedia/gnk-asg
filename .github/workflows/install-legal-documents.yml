<p>Automatizirani moduli mogu pomagati u prikupljanju, sažimanju ili strukturiranju informacija. Automatizacija ne zamjenjuje ljudsku provjeru za pravne, financijske, službene ili strateške odluke.</p>
<div class="legal-note">Svi tržišni i digital-assets podatci su informativni i nisu financijski savjet. Korisnik treba provjeriti ključne podatke kod primarnog izvora prije donošenja odluka.</div>'''
          }

          pages['ai-disclaimer.html'] = {
              'title': 'AI napomena | GNK ASG d.o.o.',
              'description': 'AI napomena i ograničenja javnog GNK ASG AI asistenta.',
