name: Portal Backend Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'kontakt/**'
      - 'backend/**'
      - 'status-lite/**'
      - 'operator/**'
      - 'assets/contact-form.js'
      - 'assets/status.js'
      - 'assets/app.js'
      - 'assets/frontend-stability-guard.js'
      - 'assets/ai-communication-upgrade.js'
      - 'assets/news-live.js'
      - 'assets/market.js'
      - 'assets/live-market-pulse.js'
      - 'assets/finalize-journalist-alignment.js'
      - 'sitemap.xml'
      - 'visual-sitemap.xml'
      - 'robots.txt'
      - 'sw.js'

permissions:
  contents: read

concurrency:
  group: portal-backend-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Validate backend data workflows and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/status.json >/dev/null
          python -m json.tool data/news_config_v2.json >/dev/null
          python -m json.tool data/news.json >/dev/null
          python -m json.tool data/news_archive.json >/dev/null
          python -m json.tool data/update_status.json >/dev/null
          python -m json.tool data/market.json >/dev/null
          python -m json.tool data/fast_market_status.json >/dev/null
          python -m json.tool data/macro_market.json >/dev/null
          python -m json.tool data/stablecoins.json >/dev/null
          python -m json.tool data/stock_exchanges.json >/dev/null
          python -m json.tool data/market_indices.json >/dev/null
          python -m json.tool data/backend_operations_manifest.json >/dev/null
          python -m json.tool data/admin_app_manifest.json >/dev/null
          python -m json.tool data/contact_channels.json >/dev/null
          python -m json.tool data/document_index.json >/dev/null
          python -m json.tool data/image_index.json >/dev/null
          python -m json.tool data/mail_automation_policy.json >/dev/null

      - name: Validate portal policy expectations
        shell: bash
        run: |
          set -euo pipefail
          grep -q "front-back-audit-02" assets/app.js
          grep -q "frontend-stability-guard.js" assets/app.js
          grep -q "ai-communication-upgrade.js" assets/app.js
          grep -q "marketGrid" assets/market.js
          grep -q "coinGrid" assets/market.js
          grep -q "data.category" assets/news-live.js
          grep -q "data.filter" assets/news-live.js
          grep -q "Europe/Zagreb" .github/workflows/business-news-twice-daily.yml
          grep -q "steps.window.outputs.run" .github/workflows/business-news-twice-daily.yml
          grep -q "noindex,nofollow" operator/frontend-health/index.html
          grep -q "noindex,nofollow" status-lite/index.html

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/news_publication.py \
            scripts/publish_daily_insight.py \
            scripts/update_fast_market.py \
            scripts/update_reference_assets.py \
            scripts/update_macro_data.py \
            scripts/generate_daily_market_brief.py \
            scripts/generate_social_preview.py \
            scripts/discover_corporate_media.py \
            scripts/generate_seo.py \
            scripts/manage_approved_media.py

      - name: Validate JavaScript syntax for active public scripts
        run: |
          node --check assets/app.js
          node --check assets/status.js
          node --check assets/contact-form.js
          node --check assets/finalize-journalist-alignment.js
          node --check assets/news-live.js
          node --check assets/market.js
          node --check assets/live-market-pulse.js
          node --check assets/frontend-stability-guard.js
          node --check assets/ai-communication-upgrade.js
          node --check sw.js
