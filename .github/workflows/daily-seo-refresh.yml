name: Daily SEO Refresh

on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_seo.py'
      - 'assets/gnk-asg-social-card.svg'
      - 'trzista/index.html'
      - 'en/markets/index.html'
      - '.github/workflows/daily-seo-refresh.yml'

permissions:
  contents: write

concurrency:
  group: seo-refresh
  cancel-in-progress: false

jobs:
  refresh-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate page metadata and search files
        run: python scripts/generate_seo.py
      - name: Commit generated SEO output
        run: |
          git config user.name "gnk-asg-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html trzista/index.html en/markets/index.html sadrzaj/index.html financije/index.html tehnologija/index.html intelligence-desk/index.html registri/index.html instalacija/index.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No SEO changes."
          else
            git commit -m "Automated full-page SEO metadata refresh"
            git push
          fi
