name: Market Fast Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_fast.py'
      - 'scripts/update_market_extensions.py'
      - 'data/asg_gold_asset.json'
      - 'data/stock_exchanges.json'
      - '.github/workflows/market-fast-refresh.yml'

permissions:
  contents: write

concurrency:
  group: market-fast-refresh
  cancel-in-progress: true

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh market charts and official open data
        run: python scripts/update_market_fast.py
      - name: Refresh ASG reference profile and stock market panel
        run: python scripts/update_market_extensions.py
      - name: Commit refreshed market data
        run: |
          if git diff --quiet -- data/market.json data/btc_chart.json data/macro_market.json data/open_data.json data/asg_gold_asset.json data/stock_exchanges.json data/update_status.json; then
            echo "No market data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/btc_chart.json data/macro_market.json data/open_data.json data/asg_gold_asset.json data/stock_exchanges.json data/update_status.json
          git commit -m "Refresh live market panels and ASG reference data [skip ci]"
          git push
