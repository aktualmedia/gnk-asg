name: Public Hourly Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/run_public_refresh.py'
      - 'scripts/update_feeds_v2.py'
      - 'data/news_config_v2.json'
      - '.github/workflows/public-hourly-refresh.yml'

permissions:
  contents: write

concurrency:
  group: public-hourly-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh safe public news and market data
        run: python scripts/run_public_refresh.py
      - name: Commit refreshed public data
        run: |
          if git diff --quiet -- data/news.json data/market.json data/btc_chart.json data/update_status.json; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json data/btc_chart.json data/update_status.json
          git commit -m "Refresh safe public portal data [skip ci]"
          git push
