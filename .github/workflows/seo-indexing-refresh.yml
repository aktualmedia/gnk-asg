name: Refresh SEO Metadata and Sitemap

# Generira dosljedne SEO meta-podatke, JSON-LD identitete, vidljive interne poveznice i sitemap.
# Namjena: jasna indeksacija javnog portala, uključujući profil Nermin Sefić / Nermin Sefic / Sefić Nermin / Sefic Nermin.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-indexing-refresh.yml'
      - 'scripts/generate_seo.py'
      - 'scripts/seo_postprocess.py'
      - 'scripts/enhance_seo_focus.py'
      - 'data/daily_insight_log.json'
      - 'nermin-sefic/index.html'
      - 'en/nermin-sefic/index.html'
      - 'insights-hr/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seo-indexing-refresh
  cancel-in-progress: true

jobs:
  generate-and-publish-seo:
    name: Generate, publish and deploy public SEO metadata and sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SEO processors
        run: python -m py_compile scripts/generate_seo.py scripts/seo_postprocess.py scripts/enhance_seo_focus.py
      - name: Generate metadata, JSON-LD, sitemap and robots
        run: |
          python scripts/generate_seo.py
          python scripts/seo_postprocess.py
          python scripts/enhance_seo_focus.py
      - name: Confirm profile pages, visible links, person metadata and author sitemap entries
        run: |
          test -f nermin-sefic/index.html
          test -f en/nermin-sefic/index.html
          test -f insights-hr/index.html
          test -f insights-hr/daily/index.html
          grep -q 'https://gnk-asg.hr/nermin-sefic/' sitemap.xml
          grep -q 'https://gnk-asg.hr/en/nermin-sefic/' sitemap.xml
          grep -q 'https://gnk-asg.hr/insights-hr/' sitemap.xml
          grep -q 'https://gnk-asg.hr/insights-hr/daily/' sitemap.xml
          grep -q 'Sefić Nermin' nermin-sefic/index.html
          grep -q 'Sefic Nermin' en/nermin-sefic/index.html
          grep -q 'profile:first_name' nermin-sefic/index.html
          grep -q 'profile:last_name' en/nermin-sefic/index.html
          grep -q 'href="nermin-sefic/"' index.html
          grep -q '<a href="/nermin-sefic/">Nermin Sefić</a>' financije/index.html
          grep -q '<a href="/en/nermin-sefic/">Nermin Sefić</a>' en/finance/index.html
      - name: Commit generated SEO publication files
        run: |
          git config user.name "gnk-asg-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html nermin-sefic/index.html en/nermin-sefic/index.html trzista/index.html en/markets/index.html sadrzaj/index.html teme/index.html financije/index.html en/finance/index.html tehnologija/index.html en/technology/index.html intelligence-desk/index.html en/intelligence-desk/index.html registri/index.html en/registries/index.html instalacija/index.html kontakt/index.html legal.html insights-hr/ sitemap.xml robots.txt llms.txt
          if git diff --cached --quiet; then
            echo "SEO metadata, internal links and sitemap are already current."
            exit 0
          fi
          git commit -m "Generate public identity SEO metadata and contextual links"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
