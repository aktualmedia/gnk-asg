name: Queue Item Action

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'ID stavke za pregled / Queue item ID'
        required: true
        type: string
      selected_action:
        description: 'Radnja / Action'
        required: true
        type: choice
        options:
          - approve
          - reject
          - delete
        default: approve

permissions:
  contents: write

concurrency:
  group: queue-item-action
  cancel-in-progress: false

jobs:
  apply-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply selected action
        env:
          REVIEW_ITEM_ID: ${{ inputs.item_id }}
          REVIEW_ACTION: ${{ inputs.selected_action }}
        run: python scripts/apply_review_decision.py
      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corporate_review_queue.json data/corporate_review_decisions.json data/media_approved.json
          git commit -m "Apply queue item action [skip ci]"
          git push
