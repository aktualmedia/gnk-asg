name: Patch Legal Menu and AL Knowledge

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-legal-menu-ai.yml"
      - ".github/legal-ai-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal files
        shell: python
        run: |
          from pathlib import Path

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Homepage: add Legal to legacy top menu and footer/navigation if missing.
          p = Path('index.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('<a href="#dokumenti">Dokumenti</a><a href="nermin-sefic/">Nermin Sefić</a>', '<a href="#dokumenti">Dokumenti</a><a href="legal.html">Legal</a><a href="nermin-sefic/">Nermin Sefić</a>')
              s = s.replace('<a href="#news">Business News</a></div></div><div class="copyright">', '<a href="#news">Business News</a><a href="legal.html">Legal</a></div></div><div class="copyright">')
              if 'Pravni i statusni dokumenti portala' not in s:
                  card = '<article class="doc"><span class="tag">Legal · GNK ASG d.o.o.</span><h3>Pravni i statusni dokumenti portala</h3><p>Impresum, politika privatnosti, kolačići, uvjeti korištenja, pravna napomena, status podataka, AI napomena i pristupačnost.</p><a href="legal.html">OTVORI LEGAL →</a></article>'
                  s = s.replace('</a></article></div></div></section>\n</main>', '</a></article>' + card + '</div></div></section>\n</main>')
              save(p, s)

          # 2) English homepage: add Legal to menu/footer if missing.
          p = Path('en/index.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('<a href="#dokumenti">Documents</a><a href="nermin-sefic/">Nermin Sefić</a>', '<a href="#dokumenti">Documents</a><a href="/legal.html">Legal</a><a href="nermin-sefic/">Nermin Sefić</a>')
              s = s.replace('<a href="#news">Business News</a></div></div><div class="copyright">', '<a href="#news">Business News</a><a href="/legal.html">Legal</a></div></div><div class="copyright">')
              save(p, s)

          # 3) Portal navigation module: add Legal to generated compact navigation.
          p = Path('assets/portal-navigation.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace("insights: 'Insights', sources: 'Sources', contact: 'Contact', desk: 'AI Desk'", "insights: 'Insights', sources: 'Sources', legal: 'Legal', contact: 'Contact', desk: 'AI Desk'")
              s = s.replace("insights: 'Objave', sources: 'Izvori', contact: 'Kontakt', desk: 'AI asistent'", "insights: 'Objave', sources: 'Izvori', legal: 'Legal', contact: 'Kontakt', desk: 'AI asistent'")
              s = s.replace("const contactUrl = en ? '/en/contact/' : '/kontakt/';", "const contactUrl = en ? '/en/contact/' : '/kontakt/';\n    const legalUrl = '/legal.html';")
              s = s.replace("'<a href=\"' + sourcesUrl + '\">' + t.sources + '</a>' +\n      '<a href=\"' + contactUrl + '\">' + t.contact + '</a>' +", "'<a href=\"' + sourcesUrl + '\">' + t.sources + '</a>' +\n      '<a href=\"' + legalUrl + '\">' + t.legal + '</a>' +\n      '<a href=\"' + contactUrl + '\">' + t.contact + '</a>' +")
              save(p, s)

          # 4) Teach floating AL about Legal, privacy, cookies, data status and source status.
          p = Path('assets/floating-intelligence.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace("const DESK = '#assistant';\n  const NEWS = '#news';", "const DESK = '/#assistant';\n  const NEWS = '/#news';\n  const LEGAL = '/legal.html';")
              s = s.replace("'AI i tehnologija', 'Kontakt'", "'AI i tehnologija', 'Legal', 'Status podataka', 'Privatnost', 'Kontakt'")
              s = s.replace("'AI and technology', 'Contact'", "'AI and technology', 'Legal', 'Data status', 'Privacy', 'Contact'")
              needle = "  function answer(question) {\n    const q = String(question || '').toLowerCase();\n    const en = lang() === 'en';\n    if (!q.trim()) return t().empty;\n"
              add = "  function legalAnswer(question) {\n    const q = String(question || '').toLowerCase();\n    const en = lang() === 'en';\n    if (/privat|privacy|gdpr|osobn|personal/.test(q)) {\n      return en ? 'Privacy: GNK ASG d.o.o. is the controller for portal-related data. The portal may process technical access logs, security records, user-submitted contact data, cookie preferences and aggregated analytics where enabled. Users may request access, correction, deletion, restriction, portability, objection or withdrawal of consent where applicable. Open Legal > Privacy for the full note.' : 'Privatnost: GNK ASG d.o.o. je voditelj obrade za podatke povezane s portalom. Portal može obrađivati tehničke pristupne zapise, sigurnosne zapise, podatke koje korisnik sam dostavi, postavke kolačića i agregiranu analitiku ako je aktivirana. Korisnik može tražiti pristup, ispravak, brisanje, ograničenje, prenosivost, prigovor ili povlačenje privole gdje je primjenjivo. Otvorite Legal > Privatnost za puni tekst.';\n    }\n    if (/cookie|kolač|kolac/.test(q)) {\n      return en ? 'Cookies: the portal may use necessary cookies for security, availability and basic functionality. Functional or analytics cookies are used only where required for a feature or where a valid basis or consent exists. Marketing cookies are not a standard portal function.' : 'Kolačići: portal može koristiti nužne kolačiće za sigurnost, dostupnost i osnovni rad. Funkcionalni ili analitički kolačići koriste se samo kada su potrebni za funkciju ili kada postoji valjana osnova odnosno privola. Marketinški kolačići nisu standardna funkcija portala.';\n    }\n    if (/status|live|snapshot|delayed|fallback|izvor|source|ažur|azur|kasni|delay/.test(q)) {\n      return en ? 'Data status: LIVE means active source/API, SNAPSHOT means stored data cut, DELAYED means the expected refresh is late, and FALLBACK means the active source is unavailable and the last technical value is shown. Market and digital-asset data are informational only and not financial advice.' : 'Status podataka: LIVE znači aktivni izvor/API, SNAPSHOT znači spremljeni presjek, DELAYED znači da podatak kasni u odnosu na očekivani ritam, a FALLBACK znači da aktivni izvor nije dostupan pa se prikazuje zadnja tehnički raspoloživa vrijednost. Tržišni i digital-assets podatci su informativni i nisu financijski savjet.';\n    }\n    if (/uvjet|terms|odgovornost|disclaimer|pravna|legal|impressum|impresum/.test(q)) {\n      return en ? 'Legal: the portal legal page contains the imprint, privacy policy, cookie policy, terms of use, legal disclaimer, data/source status, AI disclaimer and accessibility statement. The content is informational and does not represent legal, tax, financial or investment advice. Open ' + LEGAL + ' for the full text.' : 'Legal: pravna stranica sadržava impresum, politiku privatnosti, politiku kolačića, uvjete korištenja, pravnu napomenu, status podataka i izvora, AI napomenu i izjavu o pristupačnosti. Sadržaj je informativan i ne predstavlja pravni, porezni, financijski ni investicijski savjet. Otvorite ' + LEGAL + ' za puni tekst.';\n    }\n    if (/ai napomena|al napomena|assistant disclaimer|operator|ovlast|admin/.test(q)) {\n      return en ? 'AI note: the public AL assistant is a helper for public portal information only. It has no administrative authority, cannot bind the company and does not replace human review for legal, financial, security, media or official decisions.' : 'AI napomena: javni AL asistent služi samo kao pomoćnik za javne informacije portala. Nema administratorske ovlasti, ne može preuzimati obveze u ime društva i ne zamjenjuje ljudsku provjeru za pravne, financijske, sigurnosne, medijske ili službene odluke.';\n    }\n    return en ? 'Open the Legal page for the full imprint, privacy, cookies, terms, data status, AI note and accessibility statement.' : 'Otvorite Legal stranicu za puni impresum, privatnost, kolačiće, uvjete, status podataka, AI napomenu i pristupačnost.';\n  }\n\n" + needle
              if 'function legalAnswer(question)' not in s:
                  s = s.replace(needle, add)
              branch = "    if (/vijest|news|držav|drzav|zemlj|country|region|hrvats|croatia|sloven|srb|serbia|bih|bosn|international|global|sport|technology|tehnolog|digital|crypto|mobilnost|mobility/.test(q)) {"
              legal_branch = "    if (/legal|impressum|impresum|privat|privacy|gdpr|cookie|kolač|kolac|uvjet|terms|disclaimer|pravna|status|snapshot|fallback|delayed|live|pristupač|pristupac|accessibility/.test(q)) {\n      return legalAnswer(question);\n    }\n" + branch
              if 'return legalAnswer(question);' not in s:
                  s = s.replace(branch, legal_branch)
              s = s.replace("<a class=\"ai-full-link\" href=\"' + DESK + '\">' + c.full + '</a><a class=\"ai-research-link\" id=\"aiWhatsAppLink\"", "<a class=\"ai-full-link\" href=\"' + DESK + '\">' + c.full + '</a><a class=\"ai-research-link\" href=\"' + LEGAL + '\">Legal</a><a class=\"ai-research-link\" id=\"aiWhatsAppLink\"")
              save(p, s)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "gnk-asg-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html assets/portal-navigation.js assets/floating-intelligence.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Improve Legal menu and teach AL assistant"
            git push
          fi
