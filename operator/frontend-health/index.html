<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>GNK ASG Frontend Health</title>
<link rel="stylesheet" href="../../assets/style.css?v=20260613-front-health-02">
<style>body{margin:0;background:#07162d;color:#07162d}.wrap{max-width:1060px;margin:auto;padding:36px 16px 80px}.head{color:#fff}.head h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:8px 0}.head p{color:#dbe7f5}.panel{background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}.btn{display:inline-block;border-radius:999px;padding:11px 15px;background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35);font-weight:900;text-decoration:none;margin:6px 6px 6px 0;cursor:pointer}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6;overflow:auto;max-height:520px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #e5edf6;border-radius:18px;padding:14px;background:#fbfdff}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;text-transform:uppercase}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:13px}.statusline{margin-top:10px;color:#23364e}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap">
<section class="head"><p>GNK ASG Operator</p><h1>Frontend Health</h1><p>Dijagnostika frontenda, cachea, JavaScript modula, javnih JSON feedova i zaštićenih backend ruta bez slanja poruka ili objava.</p><a class="btn" href="../app/">Admin App</a><a class="btn" href="../../?safe=1">Otvori portal SAFE</a><a class="btn" href="../../status-lite/">Status Lite</a><button class="btn" id="run">Pokreni provjeru</button></section>
<section class="panel"><h2>Sažetak</h2><div id="summary" class="grid"></div><div id="overall" class="statusline"></div></section>
<section class="panel"><h2>Detalji</h2><div id="details" class="box">Nije pokrenuto.</div></section>
</main><script>
(function(){
const assets=['/assets/app.js','/assets/frontend-stability-guard.js','/assets/mobile-navigation.js','/assets/ai-communication-upgrade.js','/assets/news-live.js','/assets/market.js','/assets/live-market-pulse.js','/sw.js'];
const feeds=['/data/status.json','/data/update_status.json','/data/fast_market_status.json','/data/news.json','/data/market.json','/data/macro_market.json','/data/stablecoins.json','/data/stock_exchanges.json','/data/market_indices.json','/data/admin_app_manifest.json','/data/contact_channels.json','/data/document_index.json'];
const protectedApi=['/api/operator/mail-batch/send','/api/operator/content/publish','/api/operator/content/list?limit=3','/api/operator/mail-log/list?limit=3'];
const $=id=>document.getElementById(id);function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(label,status,cls,detail){return '<div class="card"><span class="pill '+cls+'">'+esc(status)+'</span><h3>'+esc(label)+'</h3><p class="muted">'+esc(detail||'')+'</p></div>'}
async function get(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),4500);try{const r=await fetch(url+(url.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store',credentials:'include',signal:c.signal});const text=await r.text();clearTimeout(t);let parsed=null;try{parsed=JSON.parse(text)}catch(e){}return {url,http:r.status,ok:r.ok,protected:r.status===401||r.status===403||r.status===405,bytes:text.length,json:!!parsed,count:Array.isArray(parsed)?parsed.length:(parsed&&parsed.items&&parsed.items.length)||(parsed&&parsed.coins&&parsed.coins.length)||(parsed&&parsed.markets&&parsed.markets.length)||'',sample:text.slice(0,420)}}catch(e){clearTimeout(t);return {url,http:0,ok:false,error:e.message}}}
function groupStats(items,kind){const total=items.length, ok=items.filter(x=>x.ok).length, protectedOk=items.filter(x=>x.protected).length, bad=items.filter(x=>!x.ok&&!x.protected).length;return {kind,total,ok,protectedOk,bad}}
async function run(){const results=[];$('details').textContent='Provjeravam...';for(const url of assets.concat(feeds).concat(protectedApi))results.push(await get(url));const assetStats=groupStats(results.filter(x=>assets.includes(x.url)),'assets');const feedStats=groupStats(results.filter(x=>feeds.includes(x.url)),'feeds');const apiStats=groupStats(results.filter(x=>protectedApi.includes(x.url)),'protected_api');const app=results.find(x=>x.url==='/assets/app.js');const guard=results.find(x=>x.url==='/assets/frontend-stability-guard.js');const ai=results.find(x=>x.url==='/assets/ai-communication-upgrade.js');const news=results.find(x=>x.url==='/data/news.json');const market=results.find(x=>x.url==='/data/market.json');const cards=[card('Aktivni JS moduli',assetStats.ok+'/'+assetStats.total,assetStats.bad?'bad':'ok','app, guard, AI, news, market, service worker'),card('Javni JSON feedovi',feedStats.ok+'/'+feedStats.total,feedStats.bad?'bad':'ok','news, market, status, dokumenti, kontakti'),card('Zaštićeni API',apiStats.protectedOk+apiStats.ok+'/'+apiStats.total,(apiStats.bad?'warn':'ok'),'401/403/405 se ovdje smatra sigurnim zaštićenim odgovorom'),card('Stability Guard',guard&&guard.ok?'OK':'NEDOSTAJE',guard&&guard.ok?'ok':'bad','/assets/frontend-stability-guard.js'),card('AI komunikacija',ai&&ai.ok?'OK':'NEDOSTAJE',ai&&ai.ok?'ok':'bad','/assets/ai-communication-upgrade.js'),card('Market podaci',market&&market.ok?'OK':'PROBLEM',market&&market.ok?'ok':'bad',market&&market.count!==''?'stavki: '+market.count:'/data/market.json'),card('News podaci',news&&news.ok?'OK':'PROBLEM',news&&news.ok?'ok':'bad',news&&news.count!==''?'stavki: '+news.count:'/data/news.json'),card('Cache verzija',app&&/front-back-audit-02/.test(app.sample)?'OK':'PROVJERI',app&&/front-back-audit-02/.test(app.sample)?'ok':'warn','app.js treba učitati novu verziju front-back-audit-02')];$('summary').innerHTML=cards.join('');const hardBad=assetStats.bad+feedStats.bad;$('overall').textContent=hardBad===0?'Status: ključni frontend i javni backend feedovi dostupni.':'Status: postoje nedostupni moduli ili feedovi, vidi detalje.';$('details').textContent=JSON.stringify({checked_at:new Date().toISOString(),assetStats,feedStats,apiStats,results},null,2)}
$('run').onclick=run;run();
})();
</script></body></html>
