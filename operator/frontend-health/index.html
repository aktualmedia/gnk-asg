<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>GNK ASG Frontend Health</title>
<link rel="stylesheet" href="../../assets/style.css?v=20260523-8">
<style>body{margin:0;background:#07162d;color:#07162d}.wrap{max-width:980px;margin:auto;padding:36px 16px 80px}.head{color:#fff}.head h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:8px 0}.head p{color:#dbe7f5}.panel{background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}.btn{display:inline-block;border-radius:999px;padding:11px 15px;background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35);font-weight:900;text-decoration:none;margin:6px 6px 6px 0;cursor:pointer}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #e5edf6;border-radius:18px;padding:14px;background:#fbfdff}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;text-transform:uppercase}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap">
<section class="head"><p>GNK ASG Operator</p><h1>Frontend Health</h1><p>Dijagnostika menija, cachea, JS grešaka i backend endpointa.</p><a class="btn" href="../app/">Admin App</a><a class="btn" href="../../?safe=1">Otvori portal SAFE</a><button class="btn" id="run">Pokreni provjeru</button></section>
<section class="panel"><h2>Sažetak</h2><div id="summary" class="grid"></div></section>
<section class="panel"><h2>Detalji</h2><div id="details" class="box">Nije pokrenuto.</div></section>
</main><script>
(function(){
const endpoints=['/assets/app.js','/assets/frontend-stability-guard.js','/assets/mobile-navigation.js','/assets/ai-communication-upgrade.js','/sw.js','/api/operator/mail-batch/send','/api/operator/content/publish','/api/operator/content/list?limit=3'];
const $=id=>document.getElementById(id);function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(label,status,cls,detail){return '<div class="card"><span class="pill '+cls+'">'+esc(status)+'</span><h3>'+esc(label)+'</h3><p>'+esc(detail||'')+'</p></div>'}
async function get(url){try{const r=await fetch(url+(url.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store',credentials:'include'});return {url,http:r.status,ok:r.ok,text:(await r.text()).slice(0,500)}}catch(e){return {url,http:0,ok:false,error:e.message}}}
async function run(){const results=[];for(const e of endpoints)results.push(await get(e));const menu={has_button:!!document.getElementById('menuToggle'),has_nav:!!document.getElementById('navLinks'),state:window.GNK_FRONTEND_STATE||null,service_worker:!!navigator.serviceWorker};const cards=[card('Meni',menu.has_button&&menu.has_nav?'OK':'NEDOSTAJE',menu.has_button&&menu.has_nav?'ok':'bad','menuToggle/navLinks'),card('Stability guard',menu.state?'OK':'NIJE NA OVOJ STRANICI',menu.state?'ok':'warn','Na javnoj stranici mora postojati GNK_FRONTEND_STATE'),card('Backend mail',results.find(x=>x.url.includes('mail-batch'))?.http||'?',(results.find(x=>x.url.includes('mail-batch'))?.ok?'ok':'warn'),'/api/operator/mail-batch/send'),card('Backend content',results.find(x=>x.url.includes('content/publish'))?.http||'?',(results.find(x=>x.url.includes('content/publish'))?.ok?'ok':'warn'),'/api/operator/content/publish')];$('summary').innerHTML=cards.join('');$('details').textContent=JSON.stringify({menu,results},null,2)}
$('run').onclick=run;run();
})();
</script></body></html>
