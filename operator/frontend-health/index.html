<!doctype html>

<title>GNK ASG Frontend Health</title>
<link rel="stylesheet" href="../../assets/brand/brand-tokens.css?v=20260613-health-corporate-v4">
<style>body{margin:0;background:var(--gnk-deep-space);color:var(--gnk-ink);font-family:var(--gnk-font-body)}.wrap{max-width:1120px;margin:auto;padding:36px 16px 80px}.head{color:#fff}.head h1{font:850 clamp(38px,7vw,64px)/.96 var(--gnk-font-display);letter-spacing:-.045em;margin:8px 0}.head p{color:#dbe7f5}.panel{background:#fff;border:1px solid rgba(199,204,211,.72);border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}.btn{display:inline-block;border-radius:999px;padding:11px 15px;background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35);font-weight:900;text-decoration:none;margin:6px 6px 6px 0;cursor:pointer}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6;overflow:auto;max-height:520px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #e5edf6;border-radius:18px;padding:14px;background:#fbfdff}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;text-transform:uppercase}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:13px}.statusline{margin-top:10px;color:#23364e}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap"><section class="head"><p class="gnk-eyebrow">GNK ASG Operator</p><h1>Frontend Health</h1><p>Dijagnostika HR/EN fronta, cachea, javnih slojeva i JSON feedova.</p><a class="btn" href="../app/">Admin App</a><a class="btn" href="../route-map/">Route Map</a><a class="btn" href="../../home-candidate/">Home Candidate</a><a class="btn" href="../../front/">Front HR</a><a class="btn" href="../../en/front/">Front EN</a><button class="btn" id="run">Pokreni provjeru</button></section><section class="panel"><h2>Sažetak</h2><div id="summary" class="grid"></div><div id="overall" class="statusline"></div></section><section class="panel"><h2>Detalji</h2><div id="details" class="box">Nije pokrenuto.</div></section></main><script>(function(){const assets=['/assets/app.js','/assets/frontend-stability-guard.js','/assets/ai-communication-upgrade.js','/assets/news-live.js','/assets/market.js','/assets/live-market-pulse.js','/assets/brand/brand-tokens.css','/assets/brand/gnk-asg-logo-primary.svg','/assets/brand/front-preview.js','/sw.js'];const feeds=['/data/status.json','/data/release_checklist.json','/data/automation_status.json','/data/route_map.json','/data/redesign_manifest.json','/data/brand_identity.json','/data/company_locations.json','/data/gnk_dinamo_ltd_media_kit.json','/data/ai_assistant_public_model.json','/data/update_status.json','/data/fast_market_status.json','/data/news.json','/data/market.json','/data/document_index.json','/sitemap.xml','/sitemap-corporate.xml'];const pages=['/front/','/en/front/','/news/','/en/news/','/media-kit/','/en/media-kit/','/gnk-dinamo-ltd-media-kit/','/en/gnk-dinamo-ltd-media-kit/','/downloads/','/en/downloads/','/locations/','/en/locations/','/assistant/','/en/assistant/','/documentation/','/en/documentation/','/operator/route-map/','/home-candidate/'];const protectedApi=['/api/operator/content/list?limit=3','/api/operator/mail-log/list?limit=3'];const $=id=>document.getElementById(id);function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(label,status,cls,detail){return '<div class="card"><span class="pill '+cls+'">'+esc(status)+'</span><h3>'+esc(label)+'</h3><p class="muted">'+esc(detail||'')+'</p></div>'}async function get(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),4500);try{const r=await fetch(url+(url.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store',credentials:'include',signal:c.signal});const text=await r.text();clearTimeout(t);let parsed=null;try{parsed=JSON.parse(text)}catch(e){}return {url,http:r.status,ok:r.ok,protected:r.status===401||r.status===403||r.status===405,bytes:text.length,json:!!parsed,count:Array.isArray(parsed)?parsed.length:(parsed&&parsed.items&&parsed.items.length)||(parsed&&parsed.coins&&parsed.coins.length)||(parsed&&parsed.markets&&parsed.markets.length)||'',sample:text.slice(0,520)}}catch(e){clearTimeout(t);return {url,http:0,ok:false,error:e.message}}}function groupStats(items){return {total:items.length,ok:items.filter(x=>x.ok).length,protectedOk:items.filter(x=>x.protected).length,bad:items.filter(x=>!x.ok&&!x.protected).length}}async function run(){const results=[];$('details').textContent='Provjeravam...';for(const url of assets.concat(feeds).concat(pages).concat(protectedApi))results.push(await get(url));const assetStats=groupStats(results.filter(x=>assets.includes(x.url)));const feedStats=groupStats(results.filter(x=>feeds.includes(x.url)));const pageStats=groupStats(results.filter(x=>pages.includes(x.url)));const apiStats=groupStats(results.filter(x=>protectedApi.includes(x.url)));const sw=results.find(x=>x.url==='/sw.js');const corporateSitemap=results.find(x=>x.url==='/sitemap-corporate.xml');const cards=[card('Aktivni asseti',assetStats.ok+'/'+assetStats.total,assetStats.bad?'bad':'ok','JS, CSS, logo, service worker'),card('Javni JSON/feedovi',feedStats.ok+'/'+feedStats.total,feedStats.bad?'bad':'ok','status, release, route map, brand, news, market'),card('Javne stranice HR/EN',pageStats.ok+'/'+pageStats.total,pageStats.bad?'bad':'ok','front, news, media kit, downloads, locations, assistant, docs'),card('Zaštićeni API',apiStats.protectedOk+apiStats.ok+'/'+apiStats.total,apiStats.bad?'warn':'ok','401/403/405 je prihvatljiv za nezauth provjeru'),card('Cache verzija',sw&&/corporate-redesign-03/.test(sw.sample)?'OK':'PROVJERI',sw&&/corporate-redesign-03/.test(sw.sample)?'ok':'warn','service worker corporate-redesign-03'),card('Corporate sitemap',corporateSitemap&&corporateSitemap.ok?'OK':'PROBLEM',corporateSitemap&&corporateSitemap.ok?'ok':'bad','/sitemap-corporate.xml')];$('summary').innerHTML=cards.join('');const hardBad=assetStats.bad+feedStats.bad+pageStats.bad;$('overall').textContent=hardBad===0?'Status: ključni HR/EN javni slojevi i feedovi dostupni.':'Status: postoje nedostupni moduli ili feedovi, vidi detalje.';$('details').textContent=JSON.stringify({checked_at:new Date().toISOString(),assetStats,feedStats,pageStats,apiStats,results},null,2)}$('run').onclick=run;run();})();</script></body></html>
