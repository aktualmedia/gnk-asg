<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GNK ASG WhatsApp Prep</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../../assets/style.css?v=20260523-8">
  <style>
    body{margin:0;background:#07162d;color:#07162d}.wrap{max-width:900px;margin:auto;padding:36px 16px 80px}.head{color:#fff;margin-bottom:20px}.head h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,56px);font-weight:500;margin:0 0 10px}.head p{color:#dbe7f5;line-height:1.65}.panel{background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}label{display:block;font-weight:900;margin:12px 0 7px}select,textarea,input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:14px;padding:12px;font:inherit}textarea{min-height:120px}.btn{display:inline-block;border:0;border-radius:999px;padding:11px 15px;background:#143b6d;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;margin:8px 8px 8px 0}.ghost{background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35)}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6}.small{font-size:13px;color:#64748b;line-height:1.6}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="head"><p>GNK ASG Operator</p><h1>WhatsApp Prep</h1><p>Priprema kratkog odgovora ili bilješke za WhatsApp. Ova stranica ne šalje poruke.</p><a class="btn ghost" href="../start/">Operator start</a></section>
    <section class="panel">
      <label>Vrsta odgovora</label><select id="kind"><option value="received">Potvrda primitka</option><option value="form">Uputa na kontakt formu</option><option value="posts">Objave autora</option><option value="review">Pregled ovlaštene osobe</option></select>
      <label>Dodatna napomena</label><textarea id="note" placeholder="Kratka napomena, opcionalno"></textarea>
      <button class="btn" id="make">Pripremi tekst</button><button class="btn ghost" id="copy">Kopiraj tekst</button>
      <p class="small">Automatsko WhatsApp slanje ide tek u kasnijoj fazi kroz Business API.</p>
    </section>
    <section class="panel"><h2>Tekst</h2><div id="out" class="box">Nema teksta.</div></section>
  </main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const t={received:'Pozdrav, hvala na poruci. Vaš upit je zaprimljen.',form:'Molimo pošaljite detaljniji upit kroz kontakt formu portala radi uredne evidencije.',posts:'Objave autora dostupne su na: https://gnk-asg.hr/insights-hr/',review:'Za ovo pitanje potreban je pregled ovlaštene osobe.'};
  $('make').onclick=function(){const extra=$('note').value.trim(); $('out').textContent=t[$('kind').value]+(extra?'\n\n'+extra:'')+'\n\nIT – Osobni digitalni asistent | GNK ASG d.o.o.';};
  $('copy').onclick=async()=>navigator.clipboard.writeText($('out').textContent);
})();
</script>
</body>
</html>
