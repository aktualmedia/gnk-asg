<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GNK ASG Homepage Switch Plan</title><link rel="stylesheet" href="../../assets/brand/brand-tokens.css"><style>body{margin:0;background:var(--gnk-deep-space);font-family:var(--gnk-font-body);color:var(--gnk-ink)}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:36px 0}.hero{color:#fff}.hero h1{font:850 clamp(38px,7vw,68px)/.96 var(--gnk-font-display)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #c7ccd3;border-radius:22px;padding:18px}.card h2{font-family:var(--gnk-font-display);color:var(--gnk-midnight-navy)}.box{white-space:pre-wrap;background:#f8fafc;border-radius:14px;padding:12px;max-height:420px;overflow:auto}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#fffaf0;color:#7c5616;font-weight:900;text-transform:uppercase}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><p class="gnk-eyebrow">GNK ASG Operator</p><h1>Homepage switch plan.</h1><p>Read-only plan za buduću zamjenu naslovnice i rollback referencu.</p><p><a class="gnk-btn-primary" href="../start/">Operator Start</a> <a class="gnk-btn-primary" href="../release-check/">Release Check</a> <a class="gnk-btn-primary" href="../frontend-health/">Frontend Health</a></p></section><section class="grid"><article class="card"><h2>Candidate</h2><p id="candidate">-</p></article><article class="card"><h2>Current SHA</h2><p id="sha">-</p></article><article class="card"><h2>Status</h2><p><span class="pill" id="status">Učitavanje</span></p></article></section><section class="card" style="margin-top:16px"><h2>Plan</h2><div id="raw" class="box">Učitavanje...</div></section></main><script>(async()=>{const raw=document.getElementById('raw'),c=document.getElementById('candidate'),s=document.getElementById('sha'),st=document.getElementById('status');try{const r=await fetch('../../data/homepage_switch_plan.json?cb='+Date.now(),{cache:'no-store'});const j=await r.json();c.textContent=j.candidate||'-';s.textContent=j.current_homepage_sha||'-';st.textContent=j.status||'prepared';raw.textContent=JSON.stringify(j,null,2)}catch(e){st.textContent='problem';raw.textContent=e.message}})();</script></body></html>
