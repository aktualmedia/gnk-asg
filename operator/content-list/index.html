<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>GNK ASG Content List</title>
<link rel="stylesheet" href="../../assets/style.css?v=20260523-8">
<style>body{margin:0;background:#07162d;color:#07162d}.wrap{max-width:980px;margin:auto;padding:36px 16px 80px}.head{color:#fff}.head h1{font-family:Georgia,serif;font-size:48px;font-weight:500;margin:8px 0}.head p{color:#dbe7f5}.panel{background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}.btn{display:inline-block;border-radius:999px;padding:11px 15px;background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35);font-weight:900;text-decoration:none;margin:6px 6px 6px 0;cursor:pointer}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6;overflow:auto}.item{border:1px solid #e5edf6;border-radius:18px;padding:14px;background:#fbfdff;margin:10px 0}.item strong{display:block}.item span{display:block;color:#64748b;font-size:13px;margin-top:4px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;text-transform:uppercase;background:#fef3c7;color:#92400e}</style>
</head>
<body><main class="wrap">
<section class="head"><p>GNK ASG Admin App</p><h1>Content List</h1><p>Pregled draft/ready sadržaja zaprimljenog kroz backend publish endpoint.</p><a class="btn" href="../app/">Admin App</a><a class="btn" href="../post-compose/">Post Composer</a><button class="btn" id="reload">Osvježi</button></section>
<section class="panel"><h2>Zapisi</h2><div id="items" class="box">Učitavanje...</div></section>
<section class="panel"><h2>Raw odgovor</h2><div id="raw" class="box">Učitavanje...</div></section>
</main><script>
(function(){const items=document.getElementById('items'),raw=document.getElementById('raw');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(data){const arr=data.items||[];items.innerHTML=arr.length?arr.map(x=>'<div class="item"><span class="pill">'+esc(x.status||'draft')+'</span><strong>'+esc(x.title||'Bez naslova')+'</strong><span>'+esc(x.created_at||'')+' · '+esc(x.type||'')+' · '+esc(x.public_path||'')+'</span></div>').join(''):'Nema zapisa ili KV nije spojen.';raw.textContent=JSON.stringify(data,null,2)}async function run(){items.textContent='Učitavanje...';try{const r=await fetch('/api/operator/content/list?limit=30',{credentials:'include',cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch(e){data={http:r.status,raw:text}}render(data)}catch(e){items.textContent='Greška: '+e.message;raw.textContent=e.message}}document.getElementById('reload').onclick=run;run();})();
</script></body></html>
