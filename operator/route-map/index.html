<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GNK ASG Route Map</title><link rel="stylesheet" href="../../assets/brand/brand-tokens.css"><style>body{margin:0;background:var(--gnk-deep-space);font-family:var(--gnk-font-body);color:var(--gnk-ink)}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:36px 0}.hero{color:#fff}.hero h1{font:850 clamp(38px,7vw,68px)/.96 var(--gnk-font-display)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #c7ccd3;border-radius:22px;padding:18px}.card h2{font-family:var(--gnk-font-display);color:var(--gnk-midnight-navy)}.card a{display:block;margin:6px 0;color:var(--gnk-midnight-navy);font-weight:800;text-decoration:none}.box{white-space:pre-wrap;background:#f8fafc;border-radius:14px;padding:12px;max-height:280px;overflow:auto}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><p class="gnk-eyebrow">GNK ASG Operator</p><h1>Route map.</h1><p>Pregled HR/EN javnih ruta, operator ruta, data ruta i SEO ruta.</p><p><a class="gnk-btn-primary" href="../start/">Operator Start</a> <a class="gnk-btn-primary" href="../release-check/">Release Check</a></p></section><section id="grid" class="grid"><article class="card">Učitavanje...</article></section><section class="card" style="margin-top:16px"><h2>JSON</h2><div id="raw" class="box">Učitavanje...</div></section></main><script>(async()=>{const grid=document.getElementById('grid'),raw=document.getElementById('raw');try{const r=await fetch('../../data/route_map.json?cb='+Date.now(),{cache:'no-store'});const j=await r.json();raw.textContent=JSON.stringify(j,null,2);const groups=[['HR javno',j.public_hr],['EN javno',j.public_en],['Operator',j.operator],['Data',j.data],['SEO',j.seo],['Kandidat',[j.home_candidate]]];grid.innerHTML=groups.map(g=>'<article class="card"><h2>'+g[0]+'</h2>'+g[1].map(x=>'<a href="'+x+'">'+x+'</a>').join('')+'</article>').join('')}catch(e){grid.innerHTML='<article class="card">Problem: '+e.message+'</article>';raw.textContent=e.message}})();</script></body></html>
