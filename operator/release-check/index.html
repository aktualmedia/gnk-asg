<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GNK ASG Release Check</title><link rel="stylesheet" href="../../assets/brand/brand-tokens.css"><style>body{margin:0;background:var(--gnk-deep-space);color:var(--gnk-ink);font-family:var(--gnk-font-body)}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:36px 0}.hero{color:#fff}.hero h1{font:850 clamp(40px,7vw,70px)/.96 var(--gnk-font-display)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #c7ccd3;border-radius:22px;padding:18px}.card h2{color:var(--gnk-midnight-navy);font-family:var(--gnk-font-display)}.box{white-space:pre-wrap;background:#f8fafc;border-radius:16px;padding:14px;max-height:420px;overflow:auto}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#dcfce7;color:#166534;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><p class="gnk-eyebrow">GNK ASG Operator</p><h1>Release check.</h1><p>Pregled rute kandidata, javnih HR/EN slojeva, data datoteka i operator ulaza.</p><p><a class="gnk-btn-primary" href="../app/">Admin App</a> <a class="gnk-btn-primary" href="../frontend-health/">Frontend Health</a> <a class="gnk-btn-primary" href="../../home-candidate/">Home Candidate</a></p></section><section class="grid"><article class="card"><h2>Status</h2><p><span class="pill" id="status">Učitavanje</span></p></article><article class="card"><h2>Candidate</h2><p id="candidate">-</p></article><article class="card"><h2>Data</h2><p id="counts">-</p></article></section><section class="card" style="margin-top:16px"><h2>Detalji</h2><div id="details" class="box">Učitavanje...</div></section></main><script>(async()=>{const s=document.getElementById('status'),c=document.getElementById('candidate'),n=document.getElementById('counts'),d=document.getElementById('details');try{const r=await fetch('../../data/release_checklist.json?cb='+Date.now(),{cache:'no-store'});const j=await r.json();s.textContent=j.status||'ready';c.textContent=j.candidate||'-';n.textContent='public '+(j.public_routes||[]).length+' / data '+(j.data_routes||[]).length+' / operator '+(j.operator_routes||[]).length;d.textContent=JSON.stringify(j,null,2)}catch(e){s.textContent='problem';d.textContent=e.message}})();</script></body></html>
