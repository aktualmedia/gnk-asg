<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GNK ASG Image SEO Prep</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../../assets/style.css?v=20260523-8">
  <style>
    body{margin:0;background:#07162d;color:#07162d}.wrap{max-width:980px;margin:auto;padding:36px 16px 80px}.head{color:#fff;margin-bottom:20px}.head h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,56px);font-weight:500;margin:0 0 10px}.head p{color:#dbe7f5;line-height:1.65}.panel{background:#fff;border:1px solid #dce5f0;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 16px 44px rgba(0,0,0,.18)}label{display:block;font-weight:900;margin:12px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:14px;padding:12px;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{display:inline-block;border:0;border-radius:999px;padding:11px 15px;background:#143b6d;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;margin:8px 8px 8px 0}.ghost{background:#fffaf0;color:#7c5616;border:1px solid rgba(180,126,30,.35)}.box{white-space:pre-wrap;background:#f7f9fc;border-radius:16px;padding:14px;color:#23364e;line-height:1.6}.small{font-size:13px;color:#64748b;line-height:1.6}@media(max-width:800px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="head"><p>GNK ASG Operator</p><h1>Image SEO Prep</h1><p>Priprema metapodataka za fotografije. Ova stranica ne radi stvarni upload.</p><a class="btn ghost" href="../start/">Operator start</a></section>
    <section class="panel">
      <div class="row"><div><label>Naziv datoteke</label><input id="fileName" placeholder="npr. gnk-asg-portal-01.jpg"></div><div><label>Kategorija</label><select id="category"><option>corporate</option><option>technology</option><option>finance</option><option>sports</option><option>market</option><option>documents</option><option>people</option><option>general</option></select></div></div>
      <label>Naslov slike</label><input id="title" placeholder="Naslov za internu i javnu upotrebu">
      <label>Alt tekst</label><input id="alt" placeholder="Kratak opis slike za SEO i pristupačnost">
      <label>Caption</label><textarea id="caption" placeholder="Opis ispod slike"></textarea>
      <div class="row"><div><label>Credit</label><input id="credit" placeholder="GNK ASG"></div><div><label>Ciljna stranica</label><input id="target" placeholder="/insights-hr/ ili druga stranica"></div></div>
      <label>Ključne riječi</label><input id="keywords" placeholder="GNK ASG, tehnologija, tržišta">
      <button class="btn" id="make">Generiraj JSON</button><button class="btn ghost" id="copy">Kopiraj JSON</button>
      <p class="small">Paket se kasnije može poslati u backend upload/R2 modul.</p>
    </section>
    <section class="panel"><h2>JSON paket</h2><div id="out" class="box">Nema paketa.</div></section>
  </main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function make(){const p={version:'2026-06-12-image-seo-package-01',created_at:new Date().toISOString(),file_name:$('fileName').value.trim(),title_hr:$('title').value.trim(),alt_hr:$('alt').value.trim(),caption_hr:$('caption').value.trim(),credit:$('credit').value.trim()||'GNK ASG',category:$('category').value,keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),target_page:$('target').value.trim(),public_status:'draft'}; $('out').textContent=JSON.stringify(p,null,2);}
  $('make').onclick=make;
  $('copy').onclick=async()=>navigator.clipboard.writeText($('out').textContent);
})();
</script>
</body>
</html>
