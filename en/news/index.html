<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNK ASG News</title><link rel="canonical" href="https://gnk-asg.hr/en/news/"><link rel="alternate" hreflang="hr" href="https://gnk-asg.hr/news/"><link rel="stylesheet" href="/assets/brand/brand-tokens.css"><style>body{margin:0;background:var(--gnk-mist);font-family:var(--gnk-font-body);color:var(--gnk-ink)}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.hero{background:linear-gradient(135deg,var(--gnk-deep-space),var(--gnk-midnight-navy));color:#fff;padding:50px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:30px 0}.card{background:#fff;border:1px solid #c7ccd3;border-radius:22px;padding:18px}.card h2{font-family:var(--gnk-font-display);color:var(--gnk-midnight-navy)}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><img src="/assets/brand/gnk-asg-logo-dark.svg" alt="GNK ASG" style="width:min(500px,100%)"><p class="gnk-eyebrow">News</p><h1>Business news layer.</h1><p>The full news feed is separated from the corporate homepage for faster loading.</p></div></header><main class="wrap"><div id="status" class="card">Loading news feed...</div><div id="grid" class="grid"></div></main><script>(async()=>{const status=document.getElementById('status'),grid=document.getElementById('grid');try{const r=await fetch('/data/news.json?cb='+Date.now(),{cache:'no-store'});const d=await r.json();const items=Array.isArray(d)?d:(d.items||[]);status.textContent='Loaded '+items.length+' items.';grid.innerHTML=items.slice(0,30).map(x=>'<article class="card"><h2>'+String(x.title||'Untitled').replace(/[<>]/g,'')+'</h2><p>'+String(x.summary||x.description||'').replace(/[<>]/g,'').slice(0,160)+'</p></article>').join('')}catch(e){status.textContent='News feed is currently delayed.'}})();</script></body></html>
