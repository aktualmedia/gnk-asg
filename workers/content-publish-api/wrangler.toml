compatibility_date = "2026-06-12"

# Production routes should be enabled only after Cloudflare review.
# Example:
# routes = [
#   { pattern = "gnk-asg.hr/api/operator/content/publish", zone_name = "gnk-asg.hr" },
#   { pattern = "gnk-asg.hr/api/operator/content/list", zone_name = "gnk-asg.hr" }
